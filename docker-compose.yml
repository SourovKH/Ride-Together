services:
  postgres:
    image: postgres:16-alpine
    container_name: ridetogether-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ridetogether
      POSTGRES_USER: ridetogether_user
      POSTGRES_PASSWORD: ridetogether_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridetogether_user -d ridetogether"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ridetogether-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
